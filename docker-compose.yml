services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xelma
      POSTGRES_USER: xelma
      POSTGRES_PASSWORD: xelma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xelma -d xelma"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://xelma:xelma@postgres:5432/xelma}
      # Distributed idempotency locks (Issue #493) fail closed without Redis,
      # so the API service is wired to the compose Redis instance.
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness health route lives at GET /healthz (zero-IO process check).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3000}/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  hackathon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["hackathon"]
    ports:
      - "3001:3001"
    env_file:
      - .env.hackathon.example
    environment:
      PORT: 3001
      API_MODE: hackathon
      HEALTHCHECK_PATH: /healthz
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
