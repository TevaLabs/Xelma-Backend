name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_call:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  scorecard:
    name: production-readiness scorecard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the scorecard intentionally has zero runtime deps so it
      # works on fresh forks and runs in seconds.
      - name: Run production-readiness scorecard
        run: npm run scorecard

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  contract-drift:
    name: contract drift check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check OpenAPI contract drift
        run: npm run docs:verify

  test-unit:
    name: test (unit)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      TEST_TYPE: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/

  test-route-parity:
    name: test (route parity)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run only the route-parity spec. No database is required; the spec
      # mounts in-memory Express apps and inspects their registered routes.
      - name: Run route-parity checks
        id: parity
        run: |
          npx jest --selectProjects unit \
            --testPathPattern="route-parity\.spec\.ts" \
            --forceExit \
            --no-coverage 2>&1 | tee parity-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # Always upload the JSON diff so engineers can download it from the
      # Artifacts panel even when the step succeeds (useful for audit).
      - name: Upload route-parity diff artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-parity-diff
          path: route-parity-diff.json
          if-no-files-found: ignore

      # Write a human-readable Markdown summary to the Actions run page.
      # The summary is visible in the PR check detail without opening logs.
      - name: Emit GitHub Step Summary
        if: always()
        shell: bash
        run: |
          DIFF_FILE="route-parity-diff.json"
          SUMMARY="$GITHUB_STEP_SUMMARY"

          echo "## 🛣️ Route-Parity Report" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          if [ ! -f "$DIFF_FILE" ]; then
            echo "_No diff file was produced (the spec may have failed to start)._" >> "$SUMMARY"
            exit 0
          fi

          # Pull counts from JSON
          MAIN_COUNT=$(jq '.mainRouteCount // 0' "$DIFF_FILE")
          HACK_COUNT=$(jq '.hackathonRouteCount // 0' "$DIFF_FILE")
          GEN_AT=$(jq -r '.generatedAt // "unknown"' "$DIFF_FILE")

          echo "Generated at **${GEN_AT}**" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| App | Routes found |" >> "$SUMMARY"
          echo "|-----|-------------:|" >> "$SUMMARY"
          echo "| Main app | ${MAIN_COUNT} |" >> "$SUMMARY"
          echo "| Hackathon app | ${HACK_COUNT} |" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          # Helper: render a Markdown table from a jq path
          render_table() {
            local title="$1"
            local jq_path="$2"
            local count
            count=$(jq "${jq_path} | length" "$DIFF_FILE")
            if [ "$count" -eq 0 ]; then
              echo "### ✅ ${title}" >> "$SUMMARY"
              echo "_No issues found._" >> "$SUMMARY"
            else
              echo "### ❌ ${title} (${count} issue(s))" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              echo "| Method | Path |" >> "$SUMMARY"
              echo "|--------|------|" >> "$SUMMARY"
              jq -r "${jq_path}[] | split(\" \") | \"| \" + .[0] + \" | \" + (.[1:] | join(\" \")) + \" |\"" \
                "$DIFF_FILE" >> "$SUMMARY"
            fi
            echo "" >> "$SUMMARY"
          }

          render_table "Versioned-alias drift — routes in /api not mirrored in /api/v1" ".versionedAlias.legacyOnly"
          render_table "Versioned-alias drift — routes in /api/v1 not mirrored in /api" ".versionedAlias.versionedOnly"
          render_table "Cross-app drift — routes only in main app (add to hackathon or allowlist)" ".crossApp.mainOnly"
          render_table "Cross-app drift — routes only in hackathon app (add to main or allowlist)" ".crossApp.hackathonOnly"
          render_table "Stale allowlist entries (remove from PARITY_ALLOWLIST)" ".crossApp.staleAllowlist"
          render_table "Duplicate allowlist entries (remove duplicates from PARITY_ALLOWLIST)" ".allowlistDuplicates"

          echo "---" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "**To fix:** See \`src/security/route-parity.registry.ts\` for the allowlist and" >> "$SUMMARY"
          echo "\`src/tests/route-parity.spec.ts\` for the full failure annotation in the logs." >> "$SUMMARY"

      # Fail the job after uploading artifacts and emitting the summary.
      - name: Fail if parity checks failed
        if: steps.parity.outputs.exit_code != '0'
        run: |
          echo "Route-parity checks failed. See the Step Summary above and the"
          echo "route-parity-diff artifact for the full breakdown."
          exit 1

  test-integration:
    name: test (integration)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xelma_ci
      JWT_SECRET: ci-test-secret

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: xelma_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xelma_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration

  test-hackathon-http:
    name: test (hackathon HTTP)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xelma_ci
      JWT_SECRET: ci-test-secret

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: xelma_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xelma_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run hackathon HTTP tests
        run: npm run test:hackathon:http
