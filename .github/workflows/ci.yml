name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_call:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  scorecard:
    name: production-readiness scorecard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the scorecard intentionally has zero runtime deps so it
      # works on fresh forks and runs in seconds.
      - name: Run production-readiness scorecard
        run: npm run scorecard

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  contract-drift:
    name: contract drift check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check OpenAPI contract drift
        run: npm run docs:verify

  test-unit:
    name: test (unit)
    runs-on: ubuntu-latest
    # The unit suite includes the Node.js startup-version guard, which
    # executes the compiled entry point (dist/index.js). Reuse the build
    # artifact instead of compiling twice.
    needs: build
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      TEST_TYPE: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/

  test-integration:
    name: test (integration)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xelma_ci
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The database is started as a plain container (instead of a `services:`
      # block) so a throttled container registry cannot fail the job before
      # any step runs. The retry loop absorbs transient "toomanyrequests"
      # pull failures, which GitHub-hosted runners hit regularly.
      - name: Start PostgreSQL
        run: |
          started=0
          for attempt in 1 2 3 4 5 6; do
            docker rm -f xelma-postgres >/dev/null 2>&1 || true
            if docker run -d --name xelma-postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=xelma_ci \
              -p 5432:5432 \
              postgres:16; then
              echo "PostgreSQL container started (attempt ${attempt})"
              started=1
              break
            fi
            echo "::warning::Could not start PostgreSQL (attempt ${attempt}) — registry pull may be throttled. Retrying in 20s."
            sleep 20
          done
          if [ "$started" != "1" ]; then
            echo "::error::Could not start PostgreSQL after 6 attempts"
            exit 1
          fi
          for _ in $(seq 1 60); do
            if docker exec xelma-postgres pg_isready -U postgres -d xelma_ci >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time"
          docker logs xelma-postgres || true
          exit 1

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration

  test-hackathon-http:
    name: test (hackathon HTTP)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xelma_ci
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same retrying container start as the integration job — see the comment
      # there for why the database is not a `services:` block.
      - name: Start PostgreSQL
        run: |
          started=0
          for attempt in 1 2 3 4 5 6; do
            docker rm -f xelma-postgres >/dev/null 2>&1 || true
            if docker run -d --name xelma-postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=xelma_ci \
              -p 5432:5432 \
              postgres:16; then
              echo "PostgreSQL container started (attempt ${attempt})"
              started=1
              break
            fi
            echo "::warning::Could not start PostgreSQL (attempt ${attempt}) — registry pull may be throttled. Retrying in 20s."
            sleep 20
          done
          if [ "$started" != "1" ]; then
            echo "::error::Could not start PostgreSQL after 6 attempts"
            exit 1
          fi
          for _ in $(seq 1 60); do
            if docker exec xelma-postgres pg_isready -U postgres -d xelma_ci >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time"
          docker logs xelma-postgres || true
          exit 1

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run hackathon HTTP tests
        run: npm run test:hackathon:http
