name: Load test

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  load:
    name: test (load)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run load / backpressure harness
        run: npm run test:load
